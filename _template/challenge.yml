description: |
  Adit seorang anak yang pintar, ia mendapatkan beasiswa dari SunibBank, namun
  ia perlu membuat essay 500 kata dengan topik kepemimpinan dan harus dikumpul
  dengan format zip. Akan tetapi essay yang ia buat tidak menyentuh 500 kata, 
  sehingga ia meminta bantuan temannya, John. Setelah dibantu temannya, kondisi filenya
  sudah dalam format zip, namun Adit penasaran apakah betul sudah 500 kata dan apa
  yang ditambahkan oleh temannya hingga bisa menyentuh 500 kata. Akan tetapi, 
  zip nya terkunci, kata John kuncinya ada di dalam file itu sendiri. Bisakah
  kamu menolong Adit untuk membuka zipnya?
 
