name: "zigy-zaga"
author: "Irsyad"
category: Cryptography
description: |

  Sebuah pesan berjalan tanpa arah yang pasti—
  naik, turun, lalu kembali lagi, seolah tersesat dalam jalurnya sendiri.

  Sekilas terlihat kacau.
  Namun kekacauan itu… terasa terlalu teratur.

  Apakah kamu melihat polanya?
  Atau hanya mengikuti garis lurus yang menyesatkan?

  Tidak semua pesan disembunyikan dengan cara rumit.
  Terkadang, cukup dengan mengubah jalurnya.

  Ikuti ritmenya.
  Naik. Turun. Ulangi.

  Dan mungkin… pesan itu akan menemukanmu kembali.

