description: |
  Someone on the team once said:
  "Relax bro, it's just a hash. Should take like 5 seconds."

  30 minutes later...
  still staring at the screen.

  All that was left was a single hash string.
  Nothing else. No context, no explanation.

  Simple, right?

  But honestly...
  if it's really that easy, why are you still here?

  Maybe the hash isn't the problem.
  Maybe... you're just overthinking it.

  Flag format: CSC{...}

