name: Deploy to CTFd and VPS

on:
  push:
    branches:
      - main

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Configure ctfcli
        run: |
          mkdir -p .ctf

          cat > .ctf/config << EOF
          [config]
          url = ${{ secrets.CTFD_URL }}
          access_token = ${{ secrets.CTFD_TOKEN }}

          [challenges]
          EOF

          for chal_file in $(find . -mindepth 3 -maxdepth 3 -name "challenge.yml"); do
            chal_dir=$(dirname "$chal_file")
            chal_name=$(basename "$chal_dir")
            echo "$chal_name = $chal_dir" >> .ctf/config
          done

          echo "📋 Generated config:"
          cat .ctf/config

      - name: Sync Challenges
        run: |
          ctf challenge sync

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /root/chall
            echo "📦 Menarik update terbaru dari repository..."
            git pull origin main

            echo "🐳 Mencari dan merestart semua Docker container soal..."
            find . -mindepth 2 -name docker-compose.yml -execdir docker compose up -d --build \;

            echo "🧹 Membersihkan image docker yang sudah tidak terpakai..."
            docker image prune -f