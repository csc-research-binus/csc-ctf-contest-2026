name: Deploy to CTFd and VPS

on:
  push:
    branches:
      - main

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Dapatkan daftar file yang berubah
        id: changed-ctfd-files
        uses: tj-actions/changed-files@v44
        with:
          separator: ',' # [FIX] Gunakan koma sebagai pemisah, bukan spasi

      - name: Deploy Challenges ke CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
        run: |
          mkdir -p .ctf
          
          cat <<EOF > .ctf/config
          [config]
          url = $CTFD_URL
          access_token = $CTFD_TOKEN
          
          [challenges]
          EOF

          # [FIX] Ambil output dan ubah delimiter ke koma
          FILES="${{ steps.changed-ctfd-files.outputs.all_changed_files }}"
          IFS=',' read -r -a changed_files_array <<< "$FILES"
          
          # [FIX] Gunakan associative array Bash untuk menghapus duplikasi tanpa memecah spasi
          declare -A UNIQUE_DIRS_MAP
          
          for file in "${changed_files_array[@]}"; do
            [ -z "$file" ] && continue
            
            # Ekstrak 'kategori/nama-soal'
            CHALL_DIR=$(echo "$file" | cut -d'/' -f1,2)
            
            if [ -f "$CHALL_DIR/challenge.yml" ]; then
              UNIQUE_DIRS_MAP["$CHALL_DIR"]=1
            fi
          done

          # Cek apakah array kosong
          if [ ${#UNIQUE_DIRS_MAP[@]} -eq 0 ]; then
            echo "ℹ️ Tidak ada perubahan pada file soal. Melewati tahap sync CTFd."
            exit 0
          fi

          # Tambahkan direktori yang berubah ke config
          for dir in "${!UNIQUE_DIRS_MAP[@]}"; do
            echo "$dir = $dir" >> .ctf/config
          done

          echo "✅ Config Generated:"
          cat .ctf/config

          # Eksekusi Sync/Install
          for chall_dir in "${!UNIQUE_DIRS_MAP[@]}"; do
            echo "----------------------------------------"
            echo "🚀 Deploying ke CTFd: $chall_dir"
            ctf challenge sync "$chall_dir" || ctf challenge install "$chall_dir"
          done

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Dapatkan daftar file yang berubah
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          separator: ',' # [FIX] Gunakan koma

      - name: Ekstrak direktori target Docker
        id: parse-dirs
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          IFS=',' read -r -a changed_files_array <<< "$FILES"
          
          declare -A UNIQUE_DIRS_MAP
          
          for file in "${changed_files_array[@]}"; do
            [ -z "$file" ] && continue
            CHALL_DIR=$(echo "$file" | cut -d'/' -f1,2)
            
            if [ -f "$CHALL_DIR/docker-compose.yml" ]; then
              UNIQUE_DIRS_MAP["$CHALL_DIR"]=1
            fi
          done
          
          # [FIX] Gabungkan direktori menggunakan delimiter pipe (|) untuk dikirim via SSH
          FINAL_DIRS=""
          for dir in "${!UNIQUE_DIRS_MAP[@]}"; do
            FINAL_DIRS="${FINAL_DIRS}${dir}|"
          done
          
          # Hapus pipe separator di akhir string
          FINAL_DIRS=${FINAL_DIRS%|}
          
          echo "CHALL_DIRS=$FINAL_DIRS" >> $GITHUB_ENV
          echo "Direktori terdeteksi: $FINAL_DIRS"

      - name: Deploy Container via SSH
        if: env.CHALL_DIRS != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHALL_DIRS
          script: |
            CTF_DIR="/home/ctfdeploy/csc-ctf-production/chall"
            cd $CTF_DIR
            
            echo "📦 Pulling update terbaru dari Git..."
            git pull origin main

            # [FIX] Parsing string environment variable dari GitHub Actions menggunakan pipe
            IFS='|' read -r -a dir_array <<< "$CHALL_DIRS"

            for dir in "${dir_array[@]}"; do
              [ -z "$dir" ] && continue
              
              echo "----------------------------------------"
              echo "🔄 Restarting Container: $dir"
              if [ -d "$CTF_DIR/$dir" ]; then
                cd "$CTF_DIR/$dir"
                docker compose down --remove-orphans
                docker compose up -d --build
                cd $CTF_DIR
              else
                echo "⚠️ Folder $dir tidak ditemukan di VPS!"
              fi
            done

            echo "🧹 Membersihkan image lama untuk menghemat storage..."
            docker image prune -f
            echo "✅ Semua container berhasil di-update!"