name: Deploy to CTFd and VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      challenge_dir:
        description: 'Force one challenge dir, e.g. Reverse Engineering/gimmesbr'
        required: false
        type: string
      force_all:
        description: 'Force deploy ALL challenges (Ignore git diff)'
        required: false
        type: boolean
        default: false

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Get changed directories
        id: changed-dirs
        # Hanya cari changed files jika manual dir kosong DAN force_all tidak dicentang
        if: ${{ github.event.inputs.challenge_dir == '' && github.event.inputs.force_all != 'true' }}
        uses: tj-actions/changed-files@v44
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          separator: "|"

      - name: Deploy Challenges ke CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
          MANUAL_DIR: ${{ github.event.inputs.challenge_dir }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
          CHANGED_FILES: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          mkdir -p .ctf
          cat <<EOF > .ctf/config
          [config]
          url = $CTFD_URL
          access_token = $CTFD_TOKEN

          [challenges]
          EOF

          echo "✅ Config Generated"

          # Prioritas: manual input -> force all -> changed files
          if [[ -n "$MANUAL_DIR" ]]; then
            echo "🎯 Mode: Manual dir"
            IFS='|' read -r -a DIRS_ARRAY <<< "$MANUAL_DIR"
          elif [[ "$FORCE_ALL" == "true" ]]; then
            echo "🌐 Mode: Full scan (Force deploy ALL)"
            # Ambil semua folder yang punya challenge.yml dan gabungkan dengan '|'
            ALL_DIRS=$(find . -name "challenge.yml" -exec dirname {} \; | sed 's|^\./||' | paste -sd "|" -)
            IFS='|' read -r -a DIRS_ARRAY <<< "$ALL_DIRS"
          elif [[ -n "$CHANGED_FILES" ]]; then
            echo "🔍 Mode: Changed files only"
            IFS='|' read -r -a DIRS_ARRAY <<< "$CHANGED_FILES"
          else
            echo "ℹ️ Tidak ada modifikasi soal pada commit ini."
            exit 0
          fi

          if [[ ${#DIRS_ARRAY[@]} -eq 0 ]]; then
            echo "ℹ️ List direktori kosong."
            exit 0
          fi

          DEPLOYED=0
          FAILED=0

          for dir in "${DIRS_ARRAY[@]}"; do
            [[ -z "$dir" ]] && continue
            [[ ! -f "$dir/challenge.yml" ]] && continue

            echo "----------------------------------------"
            echo "🚀 Processing: $dir"

            # 1. Coba sync metadata (update deskripsi, poin, kategori)
            if ctf challenge sync "$dir" 2>/dev/null; then
              echo "✅ Synced (Metadata updated): $dir"
              # Gunakan bypass (||) agar script tidak mati jika push file gagal
              ctf challenge push "$dir" >/dev/null 2>&1 || echo "   ⚠️  Push file dilewati (Mungkin tidak ada attachment)"
              DEPLOYED=$((DEPLOYED + 1))
            
            # 2. Jika sync gagal (berarti soal belum terdaftar di CTFd), lakukan install
            elif ctf challenge install "$dir"; then
              echo "✅ Installed (Soal baru): $dir"
              ctf challenge push "$dir" >/dev/null 2>&1 || echo "   ⚠️  Push file dilewati (Mungkin tidak ada attachment)"
              DEPLOYED=$((DEPLOYED + 1))
            
            # 3. Jika keduanya gagal
            else
              echo "❌ FATAL: Gagal memproses $dir"
              FAILED=$((FAILED + 1))
            fi
          done

          echo "========================================"
          echo "📊 Summary: $DEPLOYED sukses, $FAILED gagal"
          [[ $FAILED -gt 0 ]] && exit 1
          exit 0

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Docker target dirs
        id: parse-dirs
        env:
          MANUAL_DIR: ${{ github.event.inputs.challenge_dir }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
          CHANGED_FILES: ${{ needs.sync-to-ctfd.outputs.changed_files || '' }}
        run: |
          # Dapatkan ulang changed files secara manual menggunakan Git diff
          # karena output dari job sebelumnya sulit di-passing jika job kondisional
          if [[ -n "$MANUAL_DIR" ]]; then
            TARGET_DIRS="$MANUAL_DIR"
          elif [[ "$FORCE_ALL" == "true" ]]; then
            TARGET_DIRS=$(find . -name "docker-compose.yml" -exec dirname {} \; | sed 's|^\./||' | paste -sd "|" -)
          else
            TARGET_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '/' | cut -d'/' -f1,2 | sort -u | paste -sd "|" -)
          fi

          FINAL_DIRS=""
          IFS='|' read -r -a DIRS_ARRAY <<< "$TARGET_DIRS"
          for dir in "${DIRS_ARRAY[@]}"; do
            [[ -z "$dir" ]] && continue
            [[ ! -f "$dir/docker-compose.yml" ]] && continue
            FINAL_DIRS="${FINAL_DIRS}${dir}|"
          done

          FINAL_DIRS="${FINAL_DIRS%|}"
          echo "CHALL_DIRS=$FINAL_DIRS" >> $GITHUB_ENV
          echo "Direktori Docker terdeteksi: $FINAL_DIRS"

      - name: Deploy Container via SSH
        if: env.CHALL_DIRS != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHALL_DIRS
          script: |
            CTF_DIR="/home/ctfdeploy/csc-ctf-production/chall"
            cd "$CTF_DIR"

            echo "📦 Pulling update terbaru dari Git..."
            git pull origin main

            IFS='|' read -r -a dir_array <<< "$CHALL_DIRS"

            for dir in "${dir_array[@]}"; do
              [[ -z "$dir" ]] && continue

              echo "----------------------------------------"
              echo "🔄 Restarting Container: $dir"

              if [ -d "$CTF_DIR/$dir" ]; then
                cd "$CTF_DIR/$dir"
                docker compose down --remove-orphans
                docker compose up -d --build
                cd "$CTF_DIR"
              else
                echo "⚠️ Folder $dir tidak ditemukan di VPS!"
              fi
            done

            echo "🧹 Membersihkan image lama..."
            docker image prune -f
            echo "✅ Semua container berhasil di-update!"