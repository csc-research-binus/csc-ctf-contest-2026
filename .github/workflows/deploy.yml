name: Deploy to CTFd and VPS

on:
  push:
    branches:
      - main

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Deploy Challenges to CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
        run: |
          mkdir -p .ctf
          printf '[config]\nurl = %s\naccess_token = %s\n' \
            "$CTFD_URL" "$CTFD_TOKEN" > .ctf/config

          echo "✅ Auth config generated"
          cat .ctf/config

          for chall_file in */*/challenge.yml; do
            [ -e "$chall_file" ] || continue
            chall_dir=$(dirname "$chall_file")
            echo "🚀 Deploying: $chall_dir"
            ctf challenge sync "$chall_dir" || ctf challenge install "$chall_dir"
          done

          echo "🎉 Done!"
  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /root/chall
            echo "📦 Menarik update terbaru dari repository..."
            git pull origin main

            echo "🐳 Mencari dan merestart semua Docker container soal..."
            find . -mindepth 2 -name docker-compose.yml -execdir docker compose up -d --build \;

            echo "🧹 Membersihkan image docker yang sudah tidak terpakai..."
            docker image prune -f