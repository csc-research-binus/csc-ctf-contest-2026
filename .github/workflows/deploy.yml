name: Deploy to CTFd and VPS

on:
  push:
    branches:
      - main

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Penting agar bisa membandingkan file yang berubah

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Dapatkan daftar file yang berubah
        id: changed-ctfd-files
        uses: tj-actions/changed-files@v44

      - name: Deploy Challenges ke CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
        run: |
          mkdir -p .ctf
          
          # Buat header config dasar
          cat <<EOF > .ctf/config
          [config]
          url = $CTFD_URL
          access_token = $CTFD_TOKEN
          
          [challenges]
          EOF

          # Logika mencari folder soal (level 2) dari file yang berubah
          DIRS=""
          for file in ${{ steps.changed-ctfd-files.outputs.all_changed_files }}; do
            # Potong path untuk mendapatkan 'kategori/nama-soal'
            CHALL_DIR=$(echo "$file" | cut -d'/' -f1,2)
            
            # Cek apakah ini folder soal yang valid (punya challenge.yml)
            if [ -f "$CHALL_DIR/challenge.yml" ]; then
              DIRS="$DIRS $CHALL_DIR"
            fi
          done
          
          # Hapus duplikasi folder
          UNIQUE_DIRS=$(echo "$DIRS" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          if [ -z "$UNIQUE_DIRS" ]; then
            echo "ℹ️ Tidak ada perubahan pada file soal. Melewati tahap sync CTFd."
            exit 0
          fi

          # Tambahkan direktori yang berubah ke ctfcli config
          for dir in $UNIQUE_DIRS; do
            echo "$dir = $dir" >> .ctf/config
          done

          echo "✅ Config Generated:"
          cat .ctf/config

          # Eksekusi Sync/Install hanya untuk soal yang berubah
          for chall_dir in $UNIQUE_DIRS; do
            echo "----------------------------------------"
            echo "🚀 Deploying ke CTFd: $chall_dir"
            ctf challenge sync "$chall_dir" || ctf challenge install "$chall_dir"
          done

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Dapatkan daftar file yang berubah
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Ekstrak direktori target Docker
        id: parse-dirs
        run: |
          DIRS=""
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            CHALL_DIR=$(echo "$file" | cut -d'/' -f1,2)
            
            # Hanya deploy jika ada docker-compose.yml di folder tersebut
            if [ -f "$CHALL_DIR/docker-compose.yml" ]; then
              DIRS="$DIRS $CHALL_DIR"
            fi
          done
          
          UNIQUE_DIRS=$(echo "$DIRS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "CHALL_DIRS=$UNIQUE_DIRS" >> $GITHUB_ENV
          echo "Direktori terdeteksi: $UNIQUE_DIRS"

      - name: Deploy Container via SSH
        if: env.CHALL_DIRS != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHALL_DIRS
          script: |
            CTF_DIR="/home/ctfdeploy/csc-ctf-production/chall"
            cd $CTF_DIR
            
            echo "📦 Pulling update terbaru dari Git..."
            git pull origin main

            for dir in $CHALL_DIRS; do
              echo "----------------------------------------"
              echo "🔄 Restarting Container: $dir"
              if [ -d "$CTF_DIR/$dir" ]; then
                cd "$CTF_DIR/$dir"
                # Menghapus container lama dan membangun ulang image agar perubahan source code masuk
                docker compose down --remove-orphans
                docker compose up -d --build
                cd $CTF_DIR
              else
                echo "⚠️ Folder $dir tidak ditemukan di VPS!"
              fi
            done

            echo "🧹 Membersihkan image lama untuk menghemat storage..."
            docker image prune -f
            echo "✅ Semua container berhasil di-update!"