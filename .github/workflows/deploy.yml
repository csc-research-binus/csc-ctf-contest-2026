name: Deploy to CTFd and VPS

on:
  push:
    branches:
      - main

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Deploy Challenges to CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
        run: |
          mkdir -p .ctf
          
          # 1. Buat base config dengan header [challenges] yang diwajibkan oleh Python configparser
          cat <<EOF > .ctf/config
          [config]
          url = $CTFD_URL
          access_token = $CTFD_TOKEN
          
          [challenges]
          EOF

          # 2. Inject semua path challenge ke bawah header [challenges]
          for chall_file in */*/challenge.yml */*/*/challenge.yml; do
            [ -e "$chall_file" ] || continue
            chall_dir=$(dirname "$chall_file")
            echo "$chall_dir = $chall_dir" >> .ctf/config
          done

          echo "✅ Config Generated:"
          cat .ctf/config

          # 3. Eksekusi Sync & Install
          for chall_file in */*/challenge.yml */*/*/challenge.yml; do
            [ -e "$chall_file" ] || continue
            chall_dir=$(dirname "$chall_file")
            echo "----------------------------------------"
            echo "🚀 Deploying: $chall_dir"
            
            # Jika sync gagal (karena soal belum ada), jalankan install
            ctf challenge sync "$chall_dir" || ctf challenge install "$chall_dir"
          done

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      # WAJIB: fetch-depth 0 agar Git memiliki riwayat untuk membandingkan perubahan file
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Dapatkan daftar file yang berubah
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            web/**
            binex/**

      - name: Ekstrak direktori target Docker
        id: parse-dirs
        run: |
          DIRS=""
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Ambil format 'kategori/nama-soal'
            CHALL_DIR=$(echo "$file" | cut -d'/' -f1,2)
            
            # Pastikan direktori memiliki docker-compose.yml
            if [ -f "$CHALL_DIR/docker-compose.yml" ]; then
              DIRS="$DIRS $CHALL_DIR"
            fi
          done
          
          # Hapus duplikasi nama direktori
          UNIQUE_DIRS=$(echo "$DIRS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Direktori yang akan di-deploy: $UNIQUE_DIRS"
          
          # Simpan ke env untuk dikirim ke SSH
          echo "CHALL_DIRS=$UNIQUE_DIRS" >> $GITHUB_ENV

      - name: Deploy Container via SSH
        # Step ini HANYA berjalan jika ada file docker-compose yang terpengaruh
        if: env.CHALL_DIRS != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHALL_DIRS
          script: |
            cd /root/chall
            echo "📦 Menarik update terbaru dari repository..."
            git pull origin main

            echo "🐳 Memulai Selective Deployment Docker..."
            # Perintah find berbahaya telah dihapus dan diganti dengan loop dinamis
            for dir in $CHALL_DIRS; do
              echo "----------------------------------------"
              echo "🔄 Merestart container untuk tantangan: $dir"
              cd "/root/chall/$dir"
              
              docker compose down --remove-orphans
              docker compose up -d --build
              
              cd /root/chall
            done

            echo "🧹 Membersihkan image docker yang sudah tidak terpakai..."
            docker image prune -f
            echo "✅ Deployment Selesai!"