name: Deploy to CTFd and VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      challenge_dir:
        description: 'Force one challenge dir, e.g. Reverse Engineering/gimmesbr'
        required: false
        type: string
      base_sha:
        description: 'Optional diff base SHA'
        required: false
        type: string
      sha:
        description: 'Optional diff target SHA'
        required: false
        type: string

jobs:
  sync-to-ctfd:
    name: Sync Challenges to CTFd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ctfcli
        run: pip install ctfcli

      - name: Get changed directories
        id: changed-dirs
        if: ${{ github.event.inputs.challenge_dir == '' }}
        uses: tj-actions/changed-files@v44
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          separator: "|"   # Lebih aman dari \n, tidak akan muncul di nama folder
          base_sha: ${{ github.event.inputs.base_sha }}
          sha: ${{ github.event.inputs.sha }}

      - name: Deploy Challenges ke CTFd
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
          MANUAL_DIR: ${{ github.event.inputs.challenge_dir }}
          CHANGED_FILES: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          mkdir -p .ctf
          cat <<EOF > .ctf/config
          [config]
          url = $CTFD_URL
          access_token = $CTFD_TOKEN

          [challenges]
          EOF

          echo "✅ Config Generated"

          # Tentukan sumber direktori
          if [[ -n "$MANUAL_DIR" ]]; then
            # Manual input: sudah newline-separated langsung
            DIRS_NL="$MANUAL_DIR"
          else
            # Changed files: separator "|", convert ke newline
            DIRS_NL="${CHANGED_FILES//|/$'\n'}"
          fi

          if [[ -z "$DIRS_NL" ]]; then
            echo "ℹ️ Tidak ada direktori yang berubah. Melewati CTFd sync."
            exit 0
          fi

          DEPLOYED=0
          FAILED=0

          while IFS= read -r dir; do
            [[ -z "$dir" ]] && continue
            [[ ! -f "$dir/challenge.yml" ]] && continue

            echo "----------------------------------------"
            echo "🚀 Processing: $dir"

            # Push = update soal yang sudah ada di CTFd
            # Install = tambah soal baru ke CTFd
            # Coba push dulu, kalau gagal (belum ada) → install
            if ctf challenge push "$dir" 2>/dev/null; then
              echo "✅ Updated existing challenge: $dir"
              DEPLOYED=$((DEPLOYED + 1))
            elif ctf challenge install "$dir"; then
              echo "✅ Installed new challenge: $dir"
              DEPLOYED=$((DEPLOYED + 1))
            else
              echo "❌ FATAL: Gagal deploy $dir"
              FAILED=$((FAILED + 1))
            fi

          done <<< "$DIRS_NL"

          echo "========================================"
          echo "📊 Summary: $DEPLOYED deployed, $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1
          exit 0

  deploy-to-vps:
    name: Deploy Containers to VPS
    runs-on: ubuntu-latest
    needs: sync-to-ctfd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed directories
        id: changed-dirs
        if: ${{ github.event.inputs.challenge_dir == '' }}
        uses: tj-actions/changed-files@v44
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          separator: "|"
          base_sha: ${{ github.event.inputs.base_sha }}
          sha: ${{ github.event.inputs.sha }}

      - name: Parse Docker target dirs
        id: parse-dirs
        env:
          MANUAL_DIR: ${{ github.event.inputs.challenge_dir }}
          CHANGED_FILES: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          if [[ -n "$MANUAL_DIR" ]]; then
            DIRS_NL="$MANUAL_DIR"
          else
            DIRS_NL="${CHANGED_FILES//|/$'\n'}"
          fi

          FINAL_DIRS=""
          while IFS= read -r dir; do
            [[ -z "$dir" ]] && continue
            [[ ! -f "$dir/docker-compose.yml" ]] && continue
            FINAL_DIRS="${FINAL_DIRS}${dir}|"
          done <<< "$DIRS_NL"

          FINAL_DIRS="${FINAL_DIRS%|}"
          echo "CHALL_DIRS=$FINAL_DIRS" >> $GITHUB_ENV
          echo "Direktori Docker terdeteksi: $FINAL_DIRS"

      - name: Deploy Container via SSH
        if: env.CHALL_DIRS != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHALL_DIRS
          script: |
            CTF_DIR="/home/ctfdeploy/csc-ctf-production/chall"
            cd "$CTF_DIR"

            echo "📦 Pulling update terbaru dari Git..."
            git pull origin main

            IFS='|' read -r -a dir_array <<< "$CHALL_DIRS"

            for dir in "${dir_array[@]}"; do
              [[ -z "$dir" ]] && continue

              echo "----------------------------------------"
              echo "🔄 Restarting Container: $dir"

              if [ -d "$CTF_DIR/$dir" ]; then
                cd "$CTF_DIR/$dir"
                docker compose down --remove-orphans
                docker compose up -d --build
                cd "$CTF_DIR"
              else
                echo "⚠️ Folder $dir tidak ditemukan di VPS!"
              fi
            done

            echo "🧹 Membersihkan image lama..."
            docker image prune -f
            echo "✅ Semua container berhasil di-update!"